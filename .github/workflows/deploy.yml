name: Deploy VPS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check deploy secrets
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PROJECT_PATH: ${{ secrets.VPS_PROJECT_PATH }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          test -n "$VPS_HOST" || { echo "::error::Missing VPS_HOST"; exit 1; }
          test -n "$VPS_USER" || { echo "::error::Missing VPS_USER"; exit 1; }
          test -n "$VPS_PROJECT_PATH" || { echo "::error::Missing VPS_PROJECT_PATH"; exit 1; }
          test -n "$VPS_SSH_KEY" || { echo "::error::Missing VPS_SSH_KEY"; exit 1; }

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd ${{ secrets.VPS_PROJECT_PATH }}
            git pull --ff-only origin main
            docker compose up -d --build
